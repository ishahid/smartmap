[package]
name = "smartmap"
version = "2.0.0-alpha.1"
description = "SmartMap: a simple desktop GIS viewer and annotation tool"
authors = ["Muhammad Imran Shahid"]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "smartmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Reading .shp/.dbf files. `geo-types` gives conversions to geometry types that geojson understands.
shapefile = { version = "0.9", features = ["geo-types"] }
geojson = "1"
geo-types = "0.7"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
shapefile = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "smartmap"
version = "2.0.0-alpha.1"
description = "SmartMap: a simple desktop GIS viewer and annotation tool"
authors = ["Muhammad Imran Shahid"]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "smartmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps attributes in file order instead of sorting them.
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2"
# Reading .shp/.dbf files. `geo-types` gives conversions to geometry types that geojson understands.
shapefile = { version = "0.9", features = ["geo-types"] }
geojson = "1"
geo-types = "0.7"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
geozero = { version = "0.15", default-features = false, features = ["with-wkb", "with-geo", "with-geojson"] }
flatgeobuf = { version = "6", default-features = false }
kml = { version = "0.14", features = ["geo-types"], default-features = false }
gpx = "0.10"
csv = "1"
proj4wkt = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
proj4rs = { version = "0.2", features = ["crs-definitions"] }
# Geodesic lengths and areas (measure tool). No default features: we only need the measuring code.
geo = { version = "0.33", default-features = false }
# Un-gzipping offline map tiles. Same pure-Rust backend (zlib-rs) that `zip` already uses.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tempfile = "3"
shapefile = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
